# ==============================================================================
# Mahy Mythic Labs
# AI Model Registry
# Version: 1.1  (fixed: replaced speculative model names with real ones)
# ==============================================================================

version: "1.1"

default_provider: openai

# Default model assigned to each agent role
default_models:
  director: gpt-4o
  research: gpt-4o
  script: gpt-4o
  storyboard: gpt-4o
  image_prompt: gpt-4o
  video_prompt: gpt-4o
  narration: gpt-4o-mini
  seo: gpt-4o-mini
  quality: gpt-4o

providers:

  # ============================================================================
  # OpenAI
  # ============================================================================

  openai:

    api_env: OPENAI_API_KEY

    models:

      gpt-4o:
        type: llm
        enabled: true
        default: true
        context_window: 128000
        max_output_tokens: 16384
        supports:
          - text
          - reasoning
          - markdown
          - json
          - code
          - planning
        best_for:
          - research
          - scripting
          - storyboard
          - seo
          - quality

      gpt-4o-mini:
        type: llm
        enabled: true
        context_window: 128000
        max_output_tokens: 16384
        supports:
          - text
          - json
          - markdown
        best_for:
          - drafting
          - rewriting
          - formatting
          - narration
          - seo

      gpt-image-1:
        type: image
        enabled: true
        supports:
          - image_generation
          - image_editing
          - transparent_background
          - high_resolution
        best_for:
          - documentary_images
          - thumbnails
          - illustrations

  # ============================================================================
  # Anthropic
  # ============================================================================

  anthropic:

    api_env: ANTHROPIC_API_KEY

    models:

      claude-opus-4:
        enabled: false
        type: llm
        best_for:
          - long_reasoning
          - planning
          - documentation

      claude-sonnet-4-5:
        enabled: false
        type: llm
        best_for:
          - scripting
          - summarization

  # ============================================================================
  # Google
  # ============================================================================

  google:

    api_env: GOOGLE_API_KEY

    models:

      gemini-2.5-pro:
        enabled: false
        type: llm
        best_for:
          - reasoning
          - multimodal
          - research

      gemini-2.5-flash:
        enabled: false
        type: llm
        best_for:
          - fast_generation
          - drafting

  # ============================================================================
  # xAI
  # ============================================================================

  xai:

    api_env: XAI_API_KEY

    models:

      grok-3:
        enabled: false
        type: llm
        best_for:
          - brainstorming
          - creativity

# ==============================================================================
# Image Generation
# ==============================================================================

image_generation:

  default: gpt-image-1

  fallback:
    - flux
    - pollinations

  providers:

    gpt-image-1:
      enabled: true

    flux:
      enabled: false

    pollinations:
      enabled: true

    ideogram:
      enabled: false

# ==============================================================================
# Video Generation
# ==============================================================================

video_generation:

  default: runway

  fallback:
    - kling
    - hailuo

  providers:

    veo3:
      enabled: false

    runway:
      enabled: false

    kling:
      enabled: false

    hailuo:
      enabled: false

# ==============================================================================
# Voice / Narration
# ==============================================================================

voice_generation:

  default: openai-tts

  fallback:
    - edge-tts

  providers:

    elevenlabs:
      enabled: false

    openai-tts:
      enabled: true
      model: tts-1-hd
      default_voice: onyx

    edge-tts:
      enabled: true
      default_voice: en-US-ChristopherNeural

# ==============================================================================
# Agent Routing
# ==============================================================================

routing:

  research_agent:
    primary: gpt-4o
    fallback:
      - claude-opus-4
      - gemini-2.5-pro

  script_writer:
    primary: gpt-4o
    fallback:
      - claude-sonnet-4-5

  storyboard_generator:
    primary: gpt-4o
    fallback:
      - claude-sonnet-4-5

  image_generator:
    primary: gpt-image-1
    fallback:
      - flux
      - pollinations

  video_generator:
    primary: runway
    fallback:
      - kling

  narration_generator:
    primary: openai-tts
    fallback:
      - edge-tts

  thumbnail_generator:
    primary: gpt-image-1
    fallback:
      - flux

  seo_optimizer:
    primary: gpt-4o-mini
    fallback:
      - claude-sonnet-4-5

  quality_agent:
    primary: gpt-4o
    fallback:
      - claude-opus-4

# ==============================================================================
# Global Generation Parameters
# ==============================================================================

generation:

  temperature: 0.7
  top_p: 0.95
  max_retries: 3
  timeout_seconds: 120
  save_prompts: true
  save_outputs: true

# ==============================================================================
# Logging
# ==============================================================================

logging:

  log_requests: true
  log_responses: true
  log_tokens: true
  log_cost: true

# ==============================================================================
# Cost Control
# ==============================================================================

cost_control:

  warn_after_usd: 10
  stop_after_usd: 50

# ==============================================================================
# Version
# ==============================================================================

repository:

  name: Mahy Mythic Labs
  version: 1.0.0
  production_ready: false
